<section id="contact" class="section section--ink">
    <style>
    #contact .contact-email{display:inline-block;font-family:var(--font-sans);font-size:clamp(22px,2.6vw,30px);font-weight:600;letter-spacing:-.01em;color:var(--text-inverse);text-decoration:none;border-bottom:2px solid var(--action);padding-bottom:3px;transition:border-color .2s ease;}
    #contact .contact-email:hover{border-color:var(--text-inverse);}
    #contact .contact-links{display:flex;gap:26px;margin-top:28px;}
    #contact .contact-links a{font-family:var(--font-sans);font-size:15px;font-weight:500;color:var(--text-inverse);opacity:.8;text-decoration:none;transition:opacity .18s ease;}
    #contact .contact-links a:hover{opacity:1;}
    #contact .contact-foot{font-family:var(--font-sans);margin-top:56px;font-size:13px;color:var(--text-inverse);opacity:.45;}
    </style>
    <div class="ds-container">
        <h2 class="section__title">Let's get in touch.</h2>
        <a class="contact-email" href="mailto:ashfaq.m.amin@gmail.com">ashfaq.m.amin@gmail.com</a>
        <div class="contact-links">
            <a href="https://linkedin.com/in/ashfaqamin" target="_blank" rel="noopener">LinkedIn &#8599;</a>
            <a href="https://www.behance.net/ashfaqamin" target="_blank" rel="noopener">Behance &#8599;</a>
        </div>
    </div>
</section>

{% raw %}
    <!-- Bootstrap Core JavaScript -->
    <script src="vendor/bootstrap/js/bootstrap.min.js"></script>

    <!-- Plugin JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-easing/1.3/jquery.easing.min.js"></script>

    <!-- Magnific Popup core JS file -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/magnific-popup.js/1.1.0/jquery.magnific-popup.min.js" integrity="sha512-IsNh5E3eYy3tr/JiX2Yx4vsCujtkhwl7SLqgnwLNgf04Hrt9BT9SXlLlZlWx+OK4ndzAoALhsMNcCmkggjZB1w==" crossorigin="anonymous"></script>
    <script>
        $(document).ready(function() {
            $('.image-popup').magnificPopup({
                type:'image',
                delegate: 'a',
                gallery:{enabled:true}
            });
        });
    </script>

    <script type="text/javascript">
        $(document).ready(function(){
            $(window).scroll(function() {
                if ( $(window).scrollTop() > 100) {
                    $('.back-to-top').fadeIn();
                } else {
                    $('.back-to-top').fadeOut();
                }
            });
        });
    </script>

    <!-- Theme JavaScript -->
    <script async src="js/main.js" type="text/javascript"></script>
{% endraw %}
